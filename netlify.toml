[build]
  command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable && export PATH=\"$PATH:$PWD/flutter/bin\" && flutter config --enable-web && flutter build web --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200